name: Terraform Formatting Auto-Fix

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'base/builds/gamededi/**/*.tf'
      - 'base/builds/homelab-router/**/*.tf'
      - 'base/builds/nas/**/*.tf'
      - 'base/builds/regulus/**/*.tf'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code on the PR branch
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # 2. Set up Python for Terraform CLI access  
      - name: Set up Python & pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install terraform-cli
      
      # 3. Initialize Terraform (needed to load state)
      - name: Terraform Init
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: v1.x.x
      
      # 4. Run terraform fmt check
      - name: Run terraform fmt check
        id: fmt-check
        run: |
          echo "Checking formatting..."
          # Check recursively for nesting modules and flag errors if needed  
          terraform fmt --recursive base/builds/ || true

          # Flag as passing if no issues, we'll auto-fix below anyway  
          if [ $? -eq 0 ]; then
            echo "fmt_needed=false" >> $GITHUB_OUTPUT
            echo "All Terraform files are properly formatted."
          else
            echo "fmt_needed=true" >> $GITHUB_OUTPUT
          fi

      # 5. Auto-fix the formatting issues (only if they exist)
      - name: Fix terraform fmt issues
        id: fix-fmt
        run: |
          echo "Fixing formatting automatically..."
          
          # Show diff to PR commenter
          terraform fmt --recursive base/builds/ || true
          
          if [ $? -ne 0 ]; then
            echo "::error::Some files needed formatting" >> $GITHUB_STEP_SUMMARY
            echo "::info::Auto-fix applied in next step" >> $GITHUB_ENV
          else
            echo "All files are freshly formatted." >> $GITHUB_STEP_SUMMARY  
          fi

      # 6. Verify the fix was successful and commit it back (if needed)
      - name: Commit fixed files to PR branch
        if: steps.fmt-check.outcome != 'success'
        run: |
          git config user.name github-actions
          git config user.email "actions@users.noreply.github.com"
          
          # Add all bases/builds .tf files to commit  
          find base/builds -name "*.tf" -type f | xargs git add || true

          # Create meaningful commit message with timestamp reference for tracing  
          COMMIT_TIME=$(date +%Y-%m-%dT%H:%M:%SZ)
          
          # Attempt the fix if it ran and failed (it would have applied changes inline to files), need to detect what changed
          git diff --cached --relative base/builds/
