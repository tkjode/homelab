apiVersion: apps/v1
kind: Deployment
metadata:
  name: converter
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: converter
      app.kubernetes.io/name: converter
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: converter
        app.kubernetes.io/name: converter
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - my-app
            topologyKey: "kubernetes.io/hostname"
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      containers:
      - name: converter
        image: ghcr.io/kennethwussmann/docker-ffmpeg-converter:latest
        imagePullPolicy: Always
        env:
        - name: SERVER_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SOURCE_DIRECTORY_PATH
          value: /videos/recordings
        - name: DESTINATION_DIRECTORY_PATH
          value: /videos/converted
        - name: GLOB_PATTERNS
          value: '*.flv'
        - name: LOCK_ENABLED
          value: "true"
        - name: LOCK_DIRECTORY_PATH
          value: /videos/.locks
        - name: LOCK_STALE_AFTER_SECONDS
          value: "86400"
        - name: REMOVE_SOURCE_AFTER_CONVERT
          value: "true"
        - name: LOG_FORMAT
          value: text
        - name: FFMPEG_ARGS
          value: -y -fflags +genpts -i %s -preset slower -c:v libx264 -crf 18 -r 30 -vf "scale=-2:1080" %s.mp4
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 4Gi
        volumeMounts:
        - mountPath: /videos
          name: videos
      volumes:
      - name: videos
        persistentVolumeClaim:
          claimName: pvc-nas-hls