apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: monitoring
  sources:
  - chart: grafana
    repoURL: oci://ghcr.io/grafana-community/helm-charts
    targetRevision: 13.0.0
    helm:
      valueFiles:
      - $values/base/builds/regulus/argocd/projects/monitoring/manifests/grafana/values.yaml
  - repoURL: ssh://git@github.com/tkjode/homelab
    targetRevision: HEAD
    ref: values
  destination:
    namespace: grafana
    server: https://kubernetes.default.svc
  revisionHistoryLimit: 0
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    automated:
      prune: false
      selfHeal: false