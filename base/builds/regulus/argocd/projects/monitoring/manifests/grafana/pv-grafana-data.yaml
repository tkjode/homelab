apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-data
  namespace: grafana
spec:
  storageClassName: nfs-bind
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: 16Ti
  accessModes:
  - ReadWriteMany
  nfs:
    path: /srv/nas/kubepv/regulus/stateful/grafana#data
    server: 10.0.0.5