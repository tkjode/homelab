apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-mcp-server
  namespace: argocd
spec:
  project: inference
  sources:
  - repoURL: ssh://git@github.com/tkjode/homelab
    targetRevision: HEAD
    path: base/builds/regulus/argocd/projects/inference/manifests/kube-mcp-server
  destination:
    namespace: kube-mcp-server
    server: https://kubernetes.default.svc
  revisionHistoryLimit: 0
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true