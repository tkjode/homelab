apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: hometheatre
  sources:
  - repoURL: ssh://git@github.com/tkjode/homelab
    targetRevision: HEAD
    path: base/builds/regulus/argocd/projects/hometheatre/manifests/jellyfin/volumes
  - chart: jellyfin
    repoURL: https://jellyfin.github.io/jellyfin-helm
    targetRevision: 3.7.0
    helm:
      valueFiles:
      - $values/base/builds/regulus/argocd/projects/hometheatre/manifests/jellyfin/values.yaml
  - repoURL: ssh://git@github.com/tkjode/homelab
    targetRevision: HEAD
    ref: values
  destination:
    namespace: jellyfin
    server: https://kubernetes.default.svc
  revisionHistoryLimit: 0
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    automated:
      prune: false
      selfHeal: false