apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: false
      selfHeal: false
  project: storage
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io
      targetRevision: v1.13.0
      helm:
        valueFiles:
        - $values/base/builds/regulus/argocd/bootstrap/longhorn/values.yaml
    - repoURL: ssh://git@github.com/tkjode/homelab
      targetRevision: HEAD
      ref: values
  destination:
    namespace: longhorn-system
    server: https://kubernetes.default.svc
  revisionHistoryLimit: 0