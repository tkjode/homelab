httproute:
  enabled: true
  hostnames:
  - longhorn.apps.phalnet.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: cluster-ingress
    namespace: default
preUpgradeChecker:
  jobEnabled: false

defaultSettings:
  defaultDataPath: "/srv/"
  csiStorageCapacityTracking: true

defaultBackupStore:
  backupTarget: nfs://10.0.0.5:/mnt/TERA/kubepv/regulus/backups?nfsOptions=nosuid,nfsvers=4.1,soft,timeo=330,retrans=3
