httproute:
  enabled: true
  hostnames:
  - longhorn.apps.phalnet.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: cluster-ingress
    namespace: default
preUpgradeChecker:
  jobEnabled: false

defaultSettings:
  defaultDataPath: "/srv/"
  csiStorageCapacityTracking: true

defaultBackupStore:
  backupTarget: nfs://10.0.0.5:/srv/nas/Backups/regulus/longhorn?nfsOptions=soft,timeo=330,retrans=3
