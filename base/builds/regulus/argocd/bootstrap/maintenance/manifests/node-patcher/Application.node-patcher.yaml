apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-patcher
  namespace: argocd
spec:
  project: maintenance
  sources:
  - repoURL: ssh://git@github.com/tkjode/homelab
    targetRevision: HEAD
    path: base/builds/regulus/argocd/bootstrap/maintenance/manifests/node-patcher
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  revisionHistoryLimit: 0
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true