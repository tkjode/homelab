services:
  gateway:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-gateway
    command: ["gateway", "run"]
    restart: unless-stopped
    shm_size: 1g
    env_file:
      - path: ./.env
        required: false
    volumes:
      - type: bind
        source: ./.env
        target: /opt/data/.env
      - type: bind
        source: ./config.yaml
        target: /opt/data/config.yaml
      - hermes_data:/opt/data
      - hermes_logs:/var/log/hermes
    ports:
      - "${GATEWAY_PORT:-8642}:8642"
      - "${DASHBOARD_PORT:-9119}:9119"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8642/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  hermes_data:
  hermes_logs:
