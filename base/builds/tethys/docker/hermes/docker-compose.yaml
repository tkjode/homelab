services:
  gateway:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-gateway
    command: gateway run
    restart: unless-stopped
    network_mode: host
    shm_size: 1g
    env_file:
      - path: ./.env
        required: false
    environment:
      OLLAMA_ENDPOINT: "http://10.0.0.15:11434/"
      DEFAULT_MODEL: "hf.co/unsloth/Qwen3.5-9B-GGUF:Q4_K_M"
      API_SERVER_ENABLED: "true"
    volumes:
      - hermes_config:/root/.config/hermes
      - hermes_data:/root/.local/share/hermes
      - opt_data:/opt/data
      - hermes_cache:/root/.cache/hermes
      - hermes_logs:/var/log/hermes
    ports:
      - "${GATEWAY_PORT:-8642}:8642"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8642/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  opt_data:
  hermes_config:
  hermes_data:
  hermes_cache:
  hermes_logs:
