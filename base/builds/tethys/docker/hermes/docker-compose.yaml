services:
  gateway:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-gateway
    command: ["gateway", "run"]
    restart: unless-stopped
    shm_size: 1g
    env_file:
      - path: ./.env
        required: false
    environment:
      HERMES_MODEL: "custom"
      TERMINAL_ENV: "local"
      OLLAMA_ENDPOINT: "http://10.0.0.15:11434/"
      DEFAULT_MODEL: "hf.co/unsloth/Qwen3.5-9B-GGUF:Q4_K_M"
      API_SERVER_ENABLED: "true"
    volumes:
      - ./config.yaml:/opt/data/config.yaml
      - hermes_data:/opt/data
      - hermes_logs:/var/log/hermes
    ports:
      - "${GATEWAY_PORT:-8642}:8642"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8642/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  hermes_data:
  hermes_logs:
