services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: pgvector
    env_file:
    - ".env"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: